<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css')}}">
</head>
<body>
   <header>
    <h1>Task Manager</h1>
    <nav>
        <ul>
            <li><a href="{{ url_for('tasks.create')}}">Add Task</a></li>
            <li><a href="{{ url_for('tasks.user_dashboard')}}">Dashboard</a></li>
             <h1>{{ current_user.username}}</h1>
        </ul>
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('auth.confirmation')}}">Logout</a>
        
        {% else %}
        <a href="{{ url_for('auth.signin')}}">Login</a>
        <a href="{{ url_for('auth.signup')}}">Create Account</a>
        
    </nav> 
    {% endif %}
   </header>

    <main>
        {% block content %}


        {% endblock %}
    </main>
</body>
</html>
